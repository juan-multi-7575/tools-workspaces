<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tools Garage is a local workbench for media tools, reusable pipelines, and workspace artifacts." />
    <meta name="theme-color" content="#F7F1DE" />
    <!--
      Both faces are free (SIL OFL) and are used only by the standalone sites in
      src/sites/. Every site declares a real system fallback in its own font
      stack, so a blocked or offline request degrades to the platform face
      instead of to a fallback webfont. `display=swap` means text paints in the
      fallback first rather than blocking on the network.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Tools Garage</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
